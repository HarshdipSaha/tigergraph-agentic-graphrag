<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1920px;height:1080px;background:radial-gradient(circle at 50% 30%,#1a2233 0%,#0b0f18 65%);
       font-family:'Segoe UI',Arial,sans-serif;color:#f5f7fa;display:flex;flex-direction:column;
       align-items:center;justify-content:center;position:relative;overflow:hidden;}
  h1{font-size:80px;font-weight:800;text-align:center;
     background:linear-gradient(90deg,#ffffff,#ffd8b0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stats{display:flex;gap:80px;margin-top:60px;}
  .stats div{text-align:center;}
  .stats .big{font-size:64px;font-weight:800;color:#ff8a3d;}
  .stats .lbl{font-size:24px;color:#8fa0bd;margin-top:6px;}
  .repo{margin-top:70px;font-size:36px;color:#c7d2e3;background:#131a28;border:2px solid #232d42;
        padding:20px 44px;border-radius:16px;font-family:Consolas,monospace;}
  .caption{position:absolute;bottom:0;left:0;right:0;background:rgba(10,13,20,0.92);
           padding:36px 90px;font-size:34px;line-height:1.4;color:#e8ecf3;border-top:2px solid #ff8a3d55;}
</style></head>
<body>
  <h1>Investigation Certificates<br>for Agentic GraphRAG</h1>
  <div class="stats">
    <div><div class="big">65/65</div><div class="lbl">tests passing</div></div>
    <div><div class="big">99/100</div><div class="lbl">reconciled vs. gold</div></div>
    <div><div class="big">42</div><div class="lbl">tokens per answer</div></div>
  </div>
  <div class="repo">github.com/HarshdipSaha/tigergraph-agentic-graphrag</div>
  <div class="caption">Sixty five tests. Reconciled against the live graph. Open source on GitHub. Investigation Certificates for Agentic GraphRAG.</div>
</body></html>
